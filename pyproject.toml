[project]
name = "modifier-25-defender"
version = "0.1.0"
description = "Documentation defensibility tool for podiatry coders, built on the JARALL Standard, with citation-first synthesis and an independent compliance guard."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Arun Veligatla", email = "arun.veligatla@gmail.com" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0",
    "openai>=1.50",
    "qdrant-client>=1.12",
    "rank-bm25>=0.2.2",
    "transformers>=4.46",
    "torch>=2.5",
    "sentence-transformers>=3.2",
    "ragas>=0.2",
    "langfuse>=2.50",
    "tiktoken>=0.8",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.9",
    "pillow>=12.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    "mypy>=1.13",
    "ruff>=0.7",
    "black>=24.10",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = false

# ---------------------------------------------------------------------------
# Linters and formatters
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "eval", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "D",             # pydocstyle (Google convention)
    "RUF",
]
ignore = [
    "D100",  # missing docstring in public module (allowed for private modules)
    "D104",  # missing docstring in public package
    "D107",  # missing docstring in __init__
    "D203",  # 1 blank line before class docstring (conflicts with D211)
    "D213",  # multi-line summary on second line (conflicts with D212)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]                # tests do not require docstrings
"eval/**" = ["D101", "D102", "D103"]   # eval scripts are pragmatic
"scripts/**" = ["D"]
"app/api/main.py" = ["D"]         # I/O glue; entry point

[tool.black]
line-length = 100
target-version = ["py311"]

# ---------------------------------------------------------------------------
# Type checking
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app"]
exclude = ["app/api/main.py", "app/infra/db.py"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["transformers.*", "sentence_transformers.*", "rank_bm25.*", "ragas.*", "langfuse.*"]
ignore_missing_imports = true
follow_imports = "skip"

# ---------------------------------------------------------------------------
# Test configuration
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "integration: integration tests that require running infrastructure",
    "slow: tests that exceed 5 seconds",
]
asyncio_mode = "auto"

# ---------------------------------------------------------------------------
# Coverage (Constitution TD-2: 80% on app/, exclude pure I/O glue)
# ---------------------------------------------------------------------------

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "app/api/main.py",
    "app/api/routes.py",
    "app/infra/db.py",
    "app/infra/settings.py",
    "app/llm/embeddings.py",
    "app/observability/langfuse_client.py",
    "app/retrieval/cli.py",
    "app/retrieval/qdrant.py",
    "app/__init__.py",
    "app/**/__init__.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
precision = 1
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
